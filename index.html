<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RB Staging">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>RB Staging</title>
<style>
/* Layout: phone-first single column, sticky header, fixed bottom tab bar — a field notebook of "if we lose contact" cards */
:root {
  --bg: #1F2429;
  --on-bg: #F1F4F6;
  --on-bg-muted: #AEB8C1;
  --surface: #FFFFFF;
  --surface-2: #F5F7F8;
  --ink: #17212A;
  --muted: #5A6772;
  --line: #D2D9DF;
  --accent: #D9510A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE6DA;
  --ok: #2E7A4E;
  --ok-soft: #DDF0E4;
  --bad: #B83227;
  --bad-soft: #F8DEDB;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
  --t-storage: #0E7C7B; --t-associate: #6A4BB8; --t-business: #2560A8; --t-landmark: #8C6212;
  --t-campground: #2E7A3A; --t-visited: #5A6878; --t-other: #6B6F76;
  --t-military: #3B5323; --t-medical: #C2185B; --t-fuel: #D32F2F; --t-armory: #5D4037;
  --c-1: #0B6E99; --c-2: #9A4D00; --c-3: #7A2E8E; --c-4: #1F7A5A; --c-5: #A3324A; --c-6: #55661A; --c-7: #2B4C9B; --c-8: #8A5A44;
  --map-water: #ECEEEA; --map-land: #F7F8F6; --map-border: #9AA6B0; --map-road: #C7B49A; --map-city: #3E4A54; --map-state: #B7C0C8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161B; --surface: #192128; --surface-2: #1F2932; --ink: #E5EBEF; --muted: #92A0AB;
    --line: #2A3540; --accent: #FF7A33; --accent-ink: #1A0E06; --accent-soft: #3A2316;
    --ok: #5DBF89; --ok-soft: #173326; --bad: #FF6E61; --bad-soft: #3A1A17; color-scheme: dark; --on-bg: #E5EBEF; --on-bg-muted: #92A0AB; --t-storage: #3CC4C2; --t-associate: #A58BF0; --t-business: #6FA8F2; --t-landmark: #E0B04F; --t-campground: #6CC77A; --t-visited: #A4B2C0; --t-other: #B4BAC2; --t-military: #8DB36A; --t-medical: #F06292; --t-fuel: #FF6B5A; --t-armory: #BCAAA4; --c-1: #5FC1EE; --c-2: #F2A65A; --c-3: #D08BE6; --c-4: #5DD1A6; --c-5: #F08CA0; --c-6: #B5CC5C; --c-7: #8FA9F5; --c-8: #D9A58C; --map-water: #151B20; --map-land: #1C252D; --map-border: #4D5B67; --map-road: #6B5D49; --map-city: #B8C4CE; --map-state: #3E4B57;
  }
}
:root[data-theme="dark"] {
  --bg: #10161B; --surface: #192128; --surface-2: #1F2932; --ink: #E5EBEF; --muted: #92A0AB;
  --line: #2A3540; --accent: #FF7A33; --accent-ink: #1A0E06; --accent-soft: #3A2316;
  --ok: #5DBF89; --ok-soft: #173326; --bad: #FF6E61; --bad-soft: #3A1A17; color-scheme: dark; --on-bg: #E5EBEF; --on-bg-muted: #92A0AB; --t-storage: #3CC4C2; --t-associate: #A58BF0; --t-business: #6FA8F2; --t-landmark: #E0B04F; --t-campground: #6CC77A; --t-visited: #A4B2C0; --t-other: #B4BAC2; --t-military: #8DB36A; --t-medical: #F06292; --t-fuel: #FF6B5A; --t-armory: #BCAAA4; --c-1: #5FC1EE; --c-2: #F2A65A; --c-3: #D08BE6; --c-4: #5DD1A6; --c-5: #F08CA0; --c-6: #B5CC5C; --c-7: #8FA9F5; --c-8: #D9A58C; --map-water: #151B20; --map-land: #1C252D; --map-border: #4D5B67; --map-road: #6B5D49; --map-city: #B8C4CE; --map-state: #3E4B57;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.brand { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
.brand span { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.field { display: grid; gap: 6px; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.input, .area { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.area { resize: vertical; min-height: 72px; line-height: 1.45; }
.mono { font-family: var(--font-mono); font-size: 12.5px; word-break: break-all; }
.hint { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; }
.hint code { font-family: var(--font-mono); color: var(--ink); }
.err { color: var(--bad); font-size: 13.5px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 11px 16px; font-weight: 600; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn-quiet { background: transparent; }
.btn-small { padding: 6px 12px; font-size: 13.5px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.55; cursor: default; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-align: left; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > .btn { flex: 1 1 140px; }

/* Lock screen */
.lock { min-height: 100%; display: grid; place-items: center; padding-block: 32px; }
.lock-inner { width: 100%; max-width: 400px; display: grid; gap: 18px; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.seg button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; display: grid; gap: 1px; min-width: 0; }
.seg button strong { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg button small { color: var(--muted); font-size: 12px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* App chrome */
header.top { position: relative; flex: none; padding-top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
header.top .brand { font-size: 26px; flex: 1; }
.chip { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.icon-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; }

main.wrap { padding-block: 16px 32px; display: grid; gap: 16px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.05; margin: 0; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
.lede { margin-top: -8px; color: var(--muted); font-size: 14px; }
.banner { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }

/* Plan cards */
details.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
details.card.removed { opacity: 0.7; }
details.card > summary { list-style: none; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; cursor: pointer; }
details.card > summary::-webkit-details-marker { display: none; }
.who { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.1; text-transform: uppercase; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
.meta { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.caret { align-self: center; color: var(--muted); font-size: 13px; transition: transform .15s; }
details[open] .caret { transform: rotate(90deg); }
dl.plan { margin: 0; padding: 0 16px 6px; display: grid; }
.plan-item { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 3px; min-width: 0; }
.plan-item dt { display: flex; align-items: center; gap: 8px; }
.plan-item dt > .label { display: inline-block; color: var(--ink); font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0; padding: 4px 9px; line-height: 1.2; }
.plan-item dd { margin: 4px 0 0; padding-left: 11px; overflow-wrap: anywhere; color: var(--ink); }
.plan-item { gap: 2px; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.panel h3 { margin: 0; font-size: 15px; font-weight: 600; }
.steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
.change { display: grid; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); }
.change:first-of-type { border-top: 0; padding-top: 0; }
.old { color: var(--muted); text-decoration: line-through; font-size: 14px; overflow-wrap: anywhere; }
.new { overflow-wrap: anywhere; }
.notice { border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.notice-bad { background: var(--bad-soft); color: var(--bad); }
.notice-ok { background: var(--ok-soft); color: var(--ok); }
.notice-info { background: var(--accent-soft); color: var(--ink); }
.code-big { font-family: var(--font-mono); font-size: 26px; font-weight: 500; letter-spacing: 0.12em; text-align: center; padding: 12px; border: 1px dashed var(--accent); border-radius: 8px; }

.person { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.person:first-of-type { border-top: 0; padding-top: 0; }
.person .name { font-weight: 600; }
.person .fp { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.person .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.person .confirm { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 8px; }

/* Tab bar */
nav.tabs { position: relative; flex: none; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav.tabs button { border: 0; background: transparent; padding: 10px 2px 12px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; border-top: 3px solid transparent; white-space: nowrap; min-width: 0; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-top-color: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 7; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); }
.sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 16, 0.55); display: grid; align-items: end; justify-items: center; padding-top: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { position: relative; width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); }
.sheet h3 { margin: 0; padding-right: 40px; font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.1; text-transform: uppercase; text-wrap: balance; }
@media (min-width: 700px) { .sheet-back { align-items: center; } }
a.btn { text-decoration: none; text-align: center; display: inline-block; }
.route { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); margin-top: 8px; min-width: 0; }
.route-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.route-head strong { font-weight: 600; }
.sketch { display: block; width: 100%; max-width: 100%; height: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.wps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.wps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; }
.wp-letter { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 12.5px; font-family: var(--font-mono); }
.wp-text { display: grid; gap: 1px; min-width: 0; overflow-wrap: anywhere; }
.leg { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.route-edit { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0; display: grid; gap: 10px; background: var(--surface-2); min-width: 0; }
.wp-edit { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1.3fr) 38px; gap: 6px; align-items: center; }
.wp-edit .input { padding: 9px 10px; min-width: 0; }
.wp-del { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 38px; font-size: 18px; line-height: 1; color: var(--muted); }
@media (max-width: 440px) { .wp-edit { grid-template-columns: 26px minmax(0, 1fr) 38px; } .wp-edit .wp-coords { grid-column: 2 / 3; grid-row: 2; } }
.sheet-body { display: grid; gap: 10px; max-height: 62vh; overflow-y: auto; font-size: 14px; }
.sketch-cap { font-size: 12px; color: var(--muted); margin-top: -4px; }
.mapstat { display: grid; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
.mapstat-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.ready-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.ready-list li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.region-checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.region-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.regions-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.region-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.region-row:first-child { border-top: 0; padding-top: 0; }
.region-row .leg { grid-column: 1 / -1; }
.warn-loud { background: var(--bad-soft); color: var(--bad); border: 2px solid var(--bad); border-radius: 8px; padding: 12px; display: grid; gap: 6px; font-size: 14px; }
.warn-loud strong.big { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.01em; }
details.more-maps { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
details.more-maps > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--muted); }
details.more-maps[open] { display: grid; gap: 10px; }
details.more-maps[open] > summary { margin-bottom: 4px; }
.btn.is-off { opacity: 0.45; }
.wps li { grid-template-columns: 26px minmax(0, 1fr) auto; }
.wp-copy { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); align-self: center; }
.setup-steps { display: grid; gap: 8px; }
.copy-box { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
details.setup-done { padding: 0; }
details.setup-done > summary { list-style: none; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; font-weight: 600; }
details.setup-done > summary::-webkit-details-marker { display: none; }
details.setup-done > .setup-body { padding: 0 16px 16px; display: grid; gap: 14px; }
.poi-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.poi-filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.poi-filter[aria-pressed="false"] { opacity: 0.45; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.poi-list { list-style: none; margin: 0; padding: 0; display: grid; }
.poi-item { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.poi-item:first-child { border-top: 0; }
.poi-num { width: 26px; height: 26px; border-radius: 50%; color: #fff; display: grid; place-items: center; font: 600 12px var(--font-mono); }
.poi-body { display: grid; gap: 3px; min-width: 0; overflow-wrap: anywhere; }
.poi-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.poi-acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.poi-edit { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; background: var(--surface-2); min-width: 0; margin: 0; }
.poi-edit-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
@media (max-width: 440px) { .poi-edit-row { grid-template-columns: minmax(0, 1fr); } }
details.route { padding: 0; gap: 0; }
details.route > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
details.route > summary::-webkit-details-marker { display: none; }
details.route > summary .rcaret { color: var(--muted); font-size: 12px; transition: transform .15s; }
details.route[open] > summary .rcaret { transform: rotate(90deg); }
details.route > summary .rmeta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
details.route > .route-body { display: grid; gap: 10px; padding: 0 12px 12px; }
.carousel { display: grid; gap: 8px; min-width: 0; }
.om-area { display: grid; gap: 4px; justify-items: start; }
.om-area[hidden] { display: none; }
.car-head { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
.car-btn { height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 18px; line-height: 1; color: var(--ink); }
.car-btn:disabled { opacity: 0.35; }
.car-label { text-align: center; font-weight: 600; font-size: 14px; }
.car-label small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.car-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 0; min-width: 0; }
.car-track::-webkit-scrollbar { display: none; }
.car-slide { flex: 0 0 100%; scroll-snap-align: start; min-width: 0; display: grid; gap: 4px; position: relative; }
.poi-dot { cursor: pointer; }

  --line: #3B100C; --accent: #FF4A3A; --accent-ink: #000000; --accent-soft: #2B0806;
  --ok: #D2603F; --ok-soft: #200A05; --bad: #FF5A47; --bad-soft: #300906; color-scheme: dark;
  --on-bg: #E2392C; --on-bg-muted: #9C2B21;
  --t-storage: #3CC4C2; --t-associate: #A58BF0; --t-business: #6FA8F2; --t-landmark: #E0B04F; --t-campground: #6CC77A; --t-visited: #A4B2C0; --t-other: #B4BAC2; --t-military: #8DB36A; --t-medical: #F06292; --t-fuel: #FF6B5A; --t-armory: #BCAAA4;
  --c-1: #5FC1EE; --c-2: #F2A65A; --c-3: #D08BE6; --c-4: #5DD1A6; --c-5: #F08CA0; --c-6: #B5CC5C; --c-7: #8FA9F5; --c-8: #D9A58C;
  --map-water: #120403; --map-land: #1A0605; --map-border: #5A1A14; --map-road: #6B2A1E; --map-city: #C9463A; --map-state: #4A1510;

<script>
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  var hadController = !!navigator.serviceWorker.controller, reloading = false;
  function show(w) {
    var b = document.getElementById('updBanner'); if (!b) return;
    b.hidden = false;
    document.getElementById('updInstall').onclick = function () { w.postMessage('install'); };
    document.getElementById('updLater').onclick = function () { b.hidden = true; };
  }
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    if (reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound', function () {
      var w = reg.installing; if (!w) return;
      w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) show(w); });
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController) { hadController = true; return; }   // first install: no reload needed
    if (!reloading) { reloading = true; location.reload(); }
  });
  window.__rbCheckUpdate = function () {
    return navigator.serviceWorker.getRegistration().then(function (r) {
      if (!r) return 'unsupported';
      return r.update().then(function () { return (r.waiting || r.installing) ? 'found' : 'none'; });
    });
  };
})();

  function spreadOverlaps(xy, minD) {

      if (used[i]) continue;
      const group = [i];
      for (let j = i + 1; j < xy.length; j++) if (!used[j] && Math.hypot(xy[j][0] - xy[i][0], xy[j][1] - xy[i][1]) < minD) group.push(j);

  // Route map: waypoints and the planned line on top of the reference map.

  const routeMinSpan = () => 0.14;   // about 10 miles top to bottom at the closest
  function sketch(pts, pois = []) {
    // Extra padding on the left/top keeps the route clear of the locator inset.

    if (!p) return;
    const ti = typeInfo(p.type);
    const slide = g.closest('.map-wrap'), svg = g.closest('svg');
    const sr = slide.getBoundingClientRect(), vr = svg.getBoundingClientRect();
    const x = vr.left - sr.left + (+g.dataset.x / MAP_W) * vr.width;
    const y = vr.top - sr.top + (+g.dataset.y / MAP_H) * vr.height;
    const pop = document.createElement('div');
    pop.className = 'poi-pop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', `Point ${num}: ${p.label}`);
    pop.innerHTML = `
      <div class="poi-pop-head">${poiBadge(p.type)}<span><span class="pnum">#${num}</span> ${esc(p.label)}</span></div>
      <span class="small muted"><span class="dot" style="background:${ti.color}"></span> ${esc(ti.label)}${placeOf(p) ? ` · ${esc(placeOf(p))}` : ''} · added by ${esc(person(mid).name)}</span>

    slide.appendChild(pop);
    const w = pop.offsetWidth, h = pop.offsetHeight;
    const left = Math.max(4, Math.min(sr.width - w - 4, x - w / 2));
    const room = vr.height + (vr.top - sr.top);
    let top = y > room / 2 ? y - h - 14 : y + 14;
    top = Math.max(4, Math.min(room - h - 4, top));
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
    pop.querySelector('button')?.focus({ preventScroll: true });

  async function setupDemo() {
    const gk = rand(32);
    const pairs = {};
    for (const m of SEED) pairs[m.id] = { s: await genPair('sign'), d: await genPair('dh') };
    const roster = SEED.map(m => ({
      id: m.id, name: m.name, status: 'active', sign: pairs[m.id].s.pub, dh: pairs[m.id].d.pub,
      rev: m.rev, updated: Date.now() - m.ago * 86400000, lastChanged: [], fields: { ...m.fields }, routes: structuredClone(m.routes || []), pois: structuredClone(m.pois || []), contacts: structuredClone(m.contacts || []),
    }));
    for (const m of SEED) {
      const sSalt = rand(16);
      const key = await pbkdf(m.id + '-pass', sSalt);
      const state = { member: m.id, epoch: 1, keys: { 1: b64(gk) }, signPriv: pairs[m.id].s.priv, dhPriv: pairs[m.id].d.priv,
        roster: structuredClone(roster), removedSelf: false, pendingIdentity: false,

      const box = await aesSeal(key, te.encode(JSON.stringify(state)));
      slotWrite(m.slot, { v: 2, name: m.name, salt: b64(sSalt), box: b64(box), practice: true });
    }

  }

  // A real group starts with one person: the phone that creates it. Others join with a package from Group → Add a new person.

      removedSelf: false, pendingIdentity: false, group: { name: f.gName.value.trim() || 'Our group', ts: Date.now(), by: id, owner: id } };
    salt = rand(16); pwKey = await pbkdf(f.sPass1.value, salt);

        if ($('#lockView').hidden) { clearInterval(lockTimer); return; }
        if (left <= 0) { clearInterval(lockTimer); lockErr = ''; showLock(); return; }
        const el = $('#lockWait'); if (el) el.textContent = clockText(left);
      }, 1000);
    }
    applyTheme();
    const p = $('#pass'); if (p) p.focus({ preventScroll: true });
  }

  function lock(reason = '') {
    pwKey = null; salt = null; st = null; draft = null;
    pending = null; importMsg = null; groupMsg = null; lastOutput = null; confirmRemove = null;
    commsEditing = false; commsDraft = null; intentEditing = false; intentDraftText = null;
    lockMode = 'unlock'; lockErr = reason; confirmErase = false;
    $('#main').innerHTML = '';
    showLock();
  }

  async function unlock(pass) {
    const rec = slotRead(slot);
    if (!rec) throw new Error('This phone has no Rally Book data.');
    if (rec.waitUntil && rec.waitUntil > Date.now()) throw new Error(`Too many wrong passwords. Try again in ${waitText(rec.waitUntil - Date.now())}.`);
    salt = unb64(rec.salt);
    pwKey = await pbkdf(pass, salt);
    try { st = JSON.parse(td.decode(await aesOpen(pwKey, unb64(rec.box)))); }
    catch {
      pwKey = null; salt = null;
      const fails = (rec.fails || 0) + 1;
      if (fails >= MAX_FAILS) {
        slotClear(slot);
        throw new Error(`${MAX_FAILS} wrong passwords in a row, so Rally Book erased its data on this phone. Ask a teammate to restore you.`);
      }
      const wait = LOCK_DELAYS[fails] || 0;
      slotWrite(slot, { ...rec, fails, waitUntil: wait ? Date.now() + wait : 0 });
      throw new Error(`That password didn't unlock this phone.${wait ? ` Wait ${waitText(wait)} before trying again.` : ''}`);
    }
    if (rec.fails || rec.waitUntil) { const { waitUntil, ...rest } = rec; slotWrite(slot, { ...rest, fails: 0 }); }
    enterApp();
  }

  function enterApp() {
    lastActivity = Date.now();
    lockErr = ''; tab = st.pendingIdentity ? 'group' : 'plans';
    ensureComms().catch(() => {});
    $('#lockView').hidden = true; $('#appView').hidden = false;
    render();
    if (!storageOk) toast('Storage is blocked here. Changes last until you close this page.');

  async function restore(form) {
    const raw = form.rPkg.value.replace(/\s+/g, '');
    if (form.rPass1.value !== form.rPass2.value) throw new Error("The two passwords don't match.");
    if (!raw.startsWith('RALLYR.')) throw new Error("That isn't a restore package. It should start with RALLYR.");
    let data;
    try {
      const u = unb64(raw.slice(7));
      const k = await pbkdf(normCode(form.rCode.value), u.slice(0, 16));
      data = JSON.parse(td.decode(await aesOpen(k, u.slice(16))));
    } catch { throw new Error("That code doesn't open this package. Check the code and that the whole package was copied."); }
    const age = Date.now() - (data.ts || 0);
    if (age > PKG_TTL) { const h = Math.max(1, Math.floor((age - PKG_TTL) / 3600000)); throw new Error(`This package expired ${h === 1 ? 'about an hour' : h + ' hours'} ago. Packages only work for 48 hours. Ask a teammate to make a new one.`); }
    if (age < -10 * 60000) throw new Error("This package's date is in the future. Check the date and time on both phones, then try again.");
    const s = await genPair('sign'), d = await genPair('dh');
    const mine = data.roster.find(r => r.id === data.member);
    mine.sign = s.pub; mine.dh = d.pub;
    st = { member: data.member, epoch: data.epoch, keys: { [data.epoch]: data.key }, signPriv: s.priv, dhPriv: d.priv,
      roster: data.roster, removedSelf: false, pendingIdentity: true, ...(data.group ? { group: data.group } : {}) };
    salt = rand(16); pwKey = await pbkdf(form.rPass1.value, salt);
    if (!SEED.length) SLOTS.filter(x => x !== slot).forEach(slotClear);   // real app: one group per phone
    await saveSt();
    groupMsg = { ok: true, text: `This phone is set up for ${mine.name}. Send your new identity to the group so they accept your updates.` };
    enterApp();
  }

                <div class="swatches" role="group" aria-label="Symbol">
                  ${ICON_CHOICES.map(n => `<button class="symbtn" type="button" data-act="newTypeIcon" data-arg="${pi}|${n}" aria-pressed="${String((p.newIcon || 'pin') === n)}" aria-label="${esc(ICON_NAME[n])}" title="${esc(ICON_NAME[n])}" style="background:var(--c-${p.newColor || 1})">${iconSvg(n, 16)}</button>`).join('')}

  function contactInput(k) {

  async function viewImport() {
    let preview = '';
    if (pending) {
      const p = pending.p;
      if (pending.type === 'plan') {
        const m = person(p.from);
        preview = `
          <h3>Update from ${esc(m.name)} <span class="chip chip-ok">Signed by ${esc(m.name)}</span></h3>
          <p class="meta">rev ${m.rev} → rev ${p.rev} · sent ${esc(fmt(p.ts))}</p>
          ${p.full && !planChanges(m, p).length ? '<p class="small muted">Nothing differs from what you already have. Accepting just records the newer version.</p>' : ''}
          ${(p.types || []).filter(t => !(st.poiTypes || []).some(x => x.id === t.id)).map(t => `<p class="notice notice-info"><span class="dot" style="background:var(--c-${t.color})"></span> New point type: <strong>${esc(t.name)}</strong>. Accepting adds it to your type list and filters.</p>`).join('')}
          ${planChanges(m, p).map(k => `
            <div class="change">
              <span class="label">${esc(LABEL[k])}</span>
              <span class="old">${k === 'routes' ? esc(routeSummary(m.routes)) : k === 'pois' ? esc(poiSummary(m.pois)) : k === 'contacts' ? esc(contactsSummary(m.contacts)) : k === 'awayurgent' ? (m.fields[k] ? 'Yes' : 'No') : (esc(m.fields[k]) || '(empty)')}</span>
              <span class="new">${k === 'routes' ? esc(routeSummary(p.routes)) : k === 'pois' ? esc(poiSummary(p.pois)) : k === 'contacts' ? esc(contactsSummary(p.contacts)) : k === 'awayurgent' ? (p.fields[k] ? 'Yes' : 'No') : (esc(p.fields[k]) || '(empty)')}</span>
            </div>`).join('')}`;
      } else if (pending.type === 'removedme') {
        preview = `
          <h3>${esc(pending.sender.name)}'s phone says this phone was removed <span class="chip chip-ok">Signed by ${esc(pending.sender.name)}</span></h3>
          <div class="warn-loud"><strong class="big">Expected this?</strong><span>If not, don't accept. Contact the group another way first. A lost or stolen phone could send this.</span></div>
          <p class="small">Either way, this phone can't open updates sent after this change, because it wasn't given the new group key. If the removal was a mistake, a teammate can restore you from the Group tab.</p>
          <p class="small muted">Accepting marks this phone as removed. It keeps what it already has.</p>`;
      } else if (pending.type === 'fbstatus') {
        const it = p.item;
        preview = `
          <h3>${esc(pending.sender.name)} ${p.done ? 'marked feedback done' : 'reopened feedback'} <span class="chip chip-ok">Signed by ${esc(pending.sender.name)}</span></h3>
          <p class="meta">${esc((FB_TYPES.find(t => t[0] === it.ftype) || [, 'Other'])[1])} · ${esc(it.section)} · from ${esc(person(it.from)?.name || 'a teammate')} · ${esc(fmt(it.ts))}</p>
          ${it.region ? `<p><strong>Region:</strong> ${esc(it.region)}</p>` : ''}
          <p><strong>Request:</strong> ${esc(it.summary || (it.text || '').slice(0, 140))}</p>
          ${p.note ? `<p><strong>${p.done ? 'What changed' : 'Why reopened'}:</strong> ${esc(p.note)}</p>` : ''}
          <p class="small muted">Accepting updates this item in your Feedback inbox${(st.feedback || []).some(f => f.id === it.id) ? '' : ' (and adds it, since you didn\'t have it yet)'}.</p>`;
      } else if (pending.type === 'feedback') {
        preview = `
          <h3>Feedback from ${esc(pending.sender.name)} <span class="chip chip-ok">Signed by ${esc(pending.sender.name)}</span></h3>
          <p class="meta">${esc((FB_TYPES.find(t => t[0] === p.ftype) || [, 'Other'])[1])} · ${esc(p.section)} · sent ${esc(fmt(p.ts))}</p>
          ${p.region ? `<p><strong>Region:</strong> ${esc(p.region)}</p>` : ''}
          ${p.text ? `<p class="fb-text">${esc(p.text)}</p>` : ''}
          <p class="small muted">Accepting saves it to your Feedback inbox on the Group tab. It doesn't change anything else.</p>`;
      } else if (pending.type === 'intent') {
        preview = `
          <h3>Intent updated by ${esc(pending.sender.name)} <span class="chip chip-ok">Signed by ${esc(pending.sender.name)}</span></h3>
          <p class="meta">version ${curIntent().rev} → version ${p.rev} · sent ${esc(fmt(p.ts))}</p>
          ${(st.unshared || []).some(u => u.key === 'intent') ? `<div class="warn-loud"><strong class="big">${esc(pending.sender.name)} posted first</strong><span>You have an intent update you haven't shared yet. Accepting replaces yours on this phone and removes your unshared update. Redo your changes on top of this one and send.</span></div>` : ''}
          <div class="intent-box intent-doc">${renderDoc(p.text)}</div>`;
      } else if (pending.type === 'groupname') {
        preview = `
          <h3>Group renamed by ${esc(pending.sender.name)} <span class="chip chip-ok">Signed by ${esc(pending.sender.name)}</span></h3>
          <div class="change"><span class="label">Group name</span><span class="old">${esc((st.group && st.group.name) || '(none)')}</span><span class="new">${esc(p.name)}</span></div>`;
      } else if (pending.type === 'comms') {
        const cur = curComms(), nf = { ...emptyComms(), ...(p.fields || {}) };
        const diff = commsChanged(nf, cur.fields || {});
        preview = `
          <h3>Comms plan updated by ${esc(pending.sender.name)} <span class="chip chip-ok">Signed by ${esc(pending.sender.name)}</span></h3>
          <p class="meta">version ${cur.rev} → version ${p.rev} · sent ${esc(fmt(p.ts))}</p>
          ${(st.unshared || []).some(u => u.key === 'comms') ? `<div class="warn-loud"><strong class="big">${esc(pending.sender.name)} posted first</strong><span>You have a comms update you haven't shared yet. Under the first dibs rule, ${esc(pending.sender.name)}'s becomes the newest version. Accepting replaces yours on this phone and removes your unshared update. Note your changes first, then redo them on top of this one and send.</span></div>` : ''}
          ${commsDirty() ? `<div class="warn-loud"><strong class="big">You have unsaved comms edits</strong><span>Accepting replaces them. Copy your changes somewhere first (Comms tab, Keep editing), then come back and accept.</span></div>` : ''}
          ${diff.length ? diff.map(k => `
            <div class="change">
              <span class="label">${esc(COMMS_LABEL[k])}</span>
              <span class="old">${k === 'channels' ? (chParse((cur.fields || {})[k]).map(c => esc(chLine(c))).join('<br>') || '(none)') : esc((cur.fields || {})[k]) || '(empty)'}</span>
              <span class="new comms-text">${k === 'channels' ? (chParse(nf[k]).map(c => esc(chLine(c))).join('<br>') || '(none)') : esc(nf[k]) || '(empty)'}</span>
            </div>`).join('') : '<p class="small muted">Nothing differs from what you already have. Accepting just records the newer version.</p>'}`;
      } else if (pending.type === 'types') {
        preview = `
          <h3>Point type change from ${esc(pending.sender.name)} <span class="chip chip-ok">Signed by ${esc(pending.sender.name)}</span></h3>
          ${p.types.map(t => `<p class="small"><span class="dot" style="background:var(--c-${t.color})"></span> <strong>${esc(t.name)}</strong>: ${t.retired ? 'retired. Existing points keep it, but it stops appearing as a choice for new points.' : 'available again for new points.'}</p>`).join('')}`;
      } else if (pending.type === 'identity') {
        preview = `
          <h3>${pending.isNew ? `New member: ${esc(p.name)}` : `${esc(p.name)}'s phone was restored`}</h3>
          <p class="small">${pending.isNew
            ? `Accepting adds ${esc(p.name)} to this phone's group list. Their updates will be checked against this identity from now on.`
            : `${esc(p.name)} set up a new or reset phone. Accepting replaces their old identity, so updates from their old phone stop being accepted.`}</p>
          <p class="meta">New identity ${esc(await fingerprint(p.signPub))}. If you can, confirm this with ${esc(p.name)} in person.</p>`;
      } else if (pending.type === 'key') {
        const names = p.removed.map(id => person(id)?.name || id).join(', ');
        preview = `
          <h3>${esc(pending.sender.name)} removed ${esc(names)} <span class="chip chip-ok">Signed by ${esc(pending.sender.name)}</span></h3>
          <p class="small">Accepting installs a new group key (generation ${p.epoch}). ${esc(names)} won't be able to open anything sent after this, and updates from ${esc(names)} will be rejected.</p>`;
      }
      preview = `<div class="panel">${preview}
        <div class="row"><button class="btn" type="button" data-act="discard">Discard</button><button class="btn btn-primary" type="button" data-act="accept">Accept</button></div></div>`;
    }
    return `
      <div class="hero">${IMPORT_ART}<button class="fb-mini" type="button" data-act="feedback" data-arg="suggestion|Import" aria-label="Send feedback about Import"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></button><h2>Import update</h2><p class="lede">Pull information from teammates here: plan changes, new points, feedback, key changes and restores.</p></div>
      <ol class="steps">
        <li>In the Signal chat, press and hold the teammate's update message and tap <strong>Copy</strong>. Copy the text itself. Don't save or download it as a file.</li>
        <li>Paste it in the box below and tap <strong>Open update</strong>.</li>
        <li>Check the preview, then tap <strong>Accept</strong>. Nothing changes until you do.</li>
      </ol>
      <p class="small muted">Updates are scrambled text that starts with RALLY2. Only phones in the group can open them.</p>
      ${removedBanner()}
      <div class="panel">
        <div class="field">
          <label class="label" for="pasteIn">Paste update</label>
          <textarea id="pasteIn" class="area mono" rows="5" placeholder="RALLY2.…"></textarea>
        </div>
        ${importMsg ? `<p class="notice ${importMsg.ok ? 'notice-ok' : 'notice-bad'}">${esc(importMsg.text)}</p>` : ''}
        ${outbox && SEED.length ? `<button class="linkbtn small" type="button" data-act="fillOutbox">Demo: paste the last thing sent (${esc(outbox.label)})</button>` : ''}
        <button class="btn btn-primary btn-block" type="button" data-act="openImport">Open update</button>
      </div>
      ${preview}`;
  }

  let intentEditing = false, intentDraftText = null;
  const TAB_NAME = { plans: 'Plans', lost: 'If we lose contact', comms: 'Comms', mine: 'My plan', import: 'Import', group: 'Group' };
  const closeX = (to = prevTab, label = 'Close Intent') => `<button class="sheet-x" style="position:static;flex:none" type="button" data-act="tab" data-arg="${to}" aria-label="${label}">${SVGI('<path d="M6 6l12 12M18 6L6 18"/>')}</button>`;
  const curIntent = () => st.intent || { rev: 0, text: INTENT_START, by: null, ts: null };
  function renderDoc(text) {
    const out = []; let list = null, para = [];
    const flushP = () => { if (para.length) { out.push(`<p>${esc(para.join(' '))}</p>`); para = []; } };
    const flushL = () => { if (list) { out.push(`<ul>${list.map(li => `<li>${esc(li)}</li>`).join('')}</ul>`); list = null; } };
    String(text).split('\n').forEach(line => {
      const t = line.trim();
      if (!t) { flushP(); flushL(); return; }
      if (t.startsWith('## ')) { flushP(); flushL(); out.push(`<h3>${esc(t.slice(3))}</h3>`); return; }
      if (t.startsWith('- ')) { flushP(); (list = list || []).push(t.slice(2)); return; }
      flushL(); para.push(t);
    });
    flushP(); flushL();
    return out.join('');
  }
  const intentRule = () => `<p class="banner" id="firstDibsIntent"><strong>Intent is shared:</strong> one page any team member can edit, unlike our individual plans.<br><strong>First dibs rule:</strong> if you're making edits and any teammate's update comes through Signal, pause and import theirs first, then send yours. For Intent, their version replaces yours: copy or write down the changes you were making and set them aside, import your teammate's update, then redo your changes and send your update to the group in Signal.</p>`;
  function viewIntent() {
    const it = curIntent();
    const who = it.by ? (person(it.by)?.name || 'a teammate') : null;
    if (intentEditing) return `
      <div class="head-row"><h2>Intent</h2>${closeX()}</div>
      <p class="lede">Edit the group's shared intent. When you save, it goes out as an update like everything else.</p>
      ${idleNote()}
      <div class="panel">
        <label class="label" for="intentText">Text</label>
        <textarea id="intentText" class="area">${esc(intentDraftText ?? it.text)}</textarea>
        <p class="hint">Start a line with <code>## </code> for a heading and <code>- </code> for a bullet. Leave a blank line between paragraphs.</p>
        <div class="row">
          <button class="btn" type="button" data-act="intentCancel">Cancel</button>
          <button class="btn btn-primary" type="button" data-act="intentSave">Save and create update</button>
        </div>
      </div>
      ${intentRule()}`;
    return `
      <div class="head-row"><h2>Intent</h2><button class="fb-mini" type="button" data-act="feedback" data-arg="suggestion|Intent" aria-label="Send feedback about Intent"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></button>${closeX()}</div>
      <p class="lede">Why we're doing this and what we've agreed. The Guide explains how to use the app; this explains what it's for.</p>
      <p class="meta">Version ${it.rev}${who ? ` · last edited by ${esc(who)}` : ''}${it.ts ? ` · ${esc(fmt(it.ts))}` : ''}</p>
      ${lastOutput && lastOutput.tab === 'intent' ? outputBlock() : ''}
      <div class="panel intent-doc">${renderDoc(it.text)}</div>
      ${st.removedSelf ? '' : `<div class="row"><button class="btn" type="button" data-act="intentEdit">Suggest changes</button></div>
      ${intentRule()}`}`;
  }

  const daysAgo = (ts) => Math.max(0, Math.floor((Date.now() - (ts || 0)) / 86400000));
  const agoText = (ts) => { const d = daysAgo(ts); return d === 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`; };
  const STALE_DAYS = 90;
  const IDLE_MIN = Math.round(IDLE_MS / 60000);
  const idleNote = () => `<details class="notice notice-info headsup">
      <summary><strong>Heads up:</strong> Rally Book locks after ${IDLE_MIN} minutes without activity and clears unsaved edits…<span class="more">Show more</span></summary>
      <p>Finish and tap Save before you set your phone down. Saving only updates this phone: your team gets the change once you copy the update and paste it into Signal.</p>

  async function viewGroup() {
    const self = me();
    const fps = {};
    for (const r of st.roster) fps[r.id] = await fingerprint(r.sign);
    const people = st.roster.map(r => {
      const isMe = r.id === st.member;
      const chip = isMe ? '<span class="chip chip-accent">You</span>'
        : r.status === 'removed' ? '<span class="chip chip-bad">Removed</span>'
        : !r.sign ? '<span class="chip">Waiting for identity</span>'
        : '<span class="chip chip-ok">Active</span>';
      let acts = '';
      if (!isMe && r.status === 'active' && !st.removedSelf) {
        acts = `
          <div class="acts">
            <button class="btn btn-small" type="button" data-act="restorePkg" data-arg="${r.id}">Restore ${esc(r.name)}</button>
            <button class="btn btn-small btn-quiet" type="button" data-act="removeAsk" data-arg="${r.id}">Remove</button>
          </div>`;
      }
      return `
        <div class="person">
          <span class="name">${esc(r.name)}${r.addedAs && r.addedAs !== r.name ? ` <span class="small muted">(added as ${esc(r.addedAs)})</span>` : ''}</span>${chip}
          <span class="fp">ID ${esc(fps[r.id])}</span>
          ${acts}
        </div>`;
    }).join('');

    return `
      <div class="head-row"><h2>Group${st.group && st.group.name ? `: ${esc(st.group.name)}` : ''}</h2><button class="fb-mini" type="button" data-act="feedback" data-arg="suggestion|Group" aria-label="Send feedback about Group"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></button></div>
      <p class="lede">Who's in the group, and how to add, restore or remove someone.</p>
      ${!st.removedSelf && groupOwner() === st.member ? '<button class="linkbtn small" type="button" data-act="groupRename" style="justify-self:start;margin-top:-8px">Change group name</button>' : ''}
      ${removedBanner()}
      ${groupMsg ? `<p class="notice ${groupMsg.ok ? 'notice-ok' : 'notice-bad'}">${esc(groupMsg.text)}</p>` : ''}
      ${st.pendingIdentity ? `
        <div class="panel">
          <h3>Send your new identity</h3>
          <p class="small muted">This phone has a new identity. Post it to the Signal group so everyone's app trusts updates from this phone.</p>
          <button class="btn btn-primary" type="button" data-act="identity">Create identity update</button>
        </div>` : ''}
      ${lastOutput && lastOutput.tab === 'group' ? outputBlock() : ''}
      <div class="panel">
        <div class="row" style="align-items:center;justify-content:space-between">
          <h3>People</h3>
          <span class="chip">Group key gen ${st.epoch}</span>
        </div>
        <div>${people}</div>
      </div>
      ${!st.removedSelf ? `
      <form data-form="addPerson" class="panel">
        <h3>Add a new person</h3>
        <div class="field"><label class="label" for="newName">Their name</label>
          <input id="newName" class="input" required maxlength="40"></div>

      <form data-form="changePass" class="panel" autocomplete="off">
        <h3>Change my password</h3>
        <div class="field"><label class="label" for="cpCur">Current password</label><input id="cpCur" class="input" type="password" required></div>
        <div class="field"><label class="label" for="cpNew1">New password</label><input id="cpNew1" class="input" type="password" minlength="6" required></div>
        <div class="field"><label class="label" for="cpNew2">Type it again</label><input id="cpNew2" class="input" type="password" minlength="6" required></div>
        <button class="btn" type="button" data-act="submitForm">Change password</button>
      </form>
      <div class="panel">
        <h3>Erase this phone</h3>
        <p class="small muted">Use this before switching to a new phone. It deletes the group's plans and your identity from this phone. A teammate can restore you on the new one. Deleting the Rally Book icon from your Home Screen does the same thing.</p>
        <button class="btn btn-danger" type="button" data-act="eraseThis">Erase Rally Book from this phone</button>
      </div>
      <div class="panel">
        <div class="head-row"><h3>Feedback inbox</h3><button class="btn btn-small" type="button" data-act="feedback">Send feedback</button></div>
        <p class="small muted">Marking an item done or reopening it creates an update for the group, so everyone's inbox shows the same status.</p>
        ${(() => {
          const all = st.feedback || [];
          if (!all.length) return '<p class="small muted">Nothing yet. Feedback appears here after you send it or import it.</p>';
          const long = (t) => (t || '').length > 220 || (t || '').split('\n').length > 4;
          const item = (f) => `
          <div class="fb-item ${f.done ? 'done' : ''}">
            <div class="poi-head"><span class="chip ${f.done ? 'chip-ok' : f.ftype === 'bug' ? 'chip-bad' : f.ftype === 'region' ? 'chip-accent' : ''}">${f.done ? 'Done' : esc((FB_TYPES.find(t => t[0] === f.ftype) || [, 'Other'])[1])}</span><span class="small muted">${esc(f.section)} · ${f.from === st.member ? 'sent by you' : 'from ' + esc(person(f.from)?.name || 'a teammate')} · ${esc(fmt(f.ts))}</span></div>
            ${f.region ? `<span><strong>Region:</strong> ${esc(f.region)}</span>` : ''}
            ${f.done
              ? `<span><strong>Request:</strong> ${esc(f.summary || (f.text || '').slice(0, 140))}</span>
                 <span><strong>What changed:</strong> ${esc(f.doneNote || 'No details given.')}</span>
                 <span class="small">Done by ${esc(f.doneBy === st.member ? 'you' : person(f.doneBy)?.name || 'a teammate')} · ${esc(fmt(f.doneTs))}</span>`
              : `${f.text ? `<span class="fb-text ${long(f.text) ? 'clamp' : ''}" id="fbt-${esc(f.id)}">${esc(f.text)}</span>` : (f.summary ? `<span class="fb-text">${esc(f.summary)}</span>` : '')}
                 ${f.reopenNote ? `<span class="small"><strong>Reopened:</strong> ${esc(f.reopenNote)}</span>` : ''}`}
            ${st.removedSelf ? '' : `<div class="fb-actions">
              ${!f.done && long(f.text) ? `<button class="btn btn-small btn-quiet" type="button" data-act="fbMore" data-arg="${esc(f.id)}">Show more</button>` : ''}
              ${!f.done && f.text ? `<button class="btn btn-small btn-quiet" type="button" data-act="fbCopy" data-arg="${esc(f.id)}">Copy text</button>` : ''}
              <button class="btn btn-small btn-quiet" type="button" data-act="fbStatus" data-arg="${esc(f.id)}">${f.done ? 'Reopen' : 'Mark done'}</button></div>`}
          </div>`;
          const open = all.filter(f => !f.done), done = all.filter(f => f.done).sort((a, b) => (b.doneTs || 0) - (a.doneTs || 0));
          return `${open.length ? `<span class="label">Open (${open.length})</span><div>${open.map(item).join('')}</div>` : '<p class="small muted">No open items.</p>'}
            ${done.length ? `<details class="fb-log"><summary><span class="label" style="margin:0">Log history (${done.length})</span></summary>
              <p class="small muted">Done items keep a short summary and what changed. The full original request isn't kept.</p><div>${done.map(item).join('')}</div></details>` : ''}`;
        })()}
      </div>
      <p class="small muted">This phone's ID is ${esc(fps[self.id])}. If someone's ID ever changes without a restore, don't trust their updates.</p>`;
  }

  // ---------------- Actions ----------------
  async function savePlan() {
    const m = me();
    const routes = [];
    draft.routes.forEach((r, ri) => {
      const name = (r.name || '').trim() || `Route ${ri + 1}`;
      const pts = [];
      r.points.forEach((w) => {
        const label = (w.label || '').trim(), c = (w.coords || '').trim();
        if (!label && !c) return;
        const where = `${name}, waypoint ${letter(pts.length)}`;
        if (!c) throw new Error(`${where} needs coordinates.`);
        const g = parseCoords(c);
        if (g.error) throw new Error(`${where}: ${g.error}`);
        pts.push({ label: label || `Point ${letter(pts.length)}`, lat: g.lat, lon: g.lon });
      });
      if (!pts.length && !(r.note || '').trim()) return;
      const regions = [];
      (r.regions || []).forEach(g => { const t = String(g).trim(); if (t && !regions.some(x => rkey(x) === rkey(t))) regions.push(t); });
      routes.push({ name, note: (r.note || '').trim(), regions, points: pts });
    });
    const pois = [];
    draft.pois.forEach((p, pi) => {
      const label = (p.label || '').trim(), c = (p.coords || '').trim(), note = (p.note || '').trim();
      if (!label && !c && !note) return;
      const where = `Point of interest ${label ? '"' + label + '"' : pi + 1}`;
      if (!c) throw new Error(`${where} needs coordinates.`);
      const g = parseCoords(c);
      if (g.error) throw new Error(`${where}: ${g.error}`);
      if (p.type === '__new') throw new Error(`${where}: finish creating the new type, or pick an existing one.`);
      const city = (p.city || '').trim(), state = (p.state || '').trim();
      pois.push({ type: typeInfo(p.type).id, label: label || typeInfo(p.type).label, ...(city ? { city } : {}), ...(state ? { state } : {}), note, lat: g.lat, lon: g.lon });
    });
    const al = (draft.fields.awayll || '').trim();
    if (al) { const g = parseCoords(al); if (g.error) throw new Error(`Current location coordinates: ${g.error}`); draft.fields.awayll = fmtLL(g); }
    const hl = (draft.fields.homell || '').trim();
    if (hl) { const g = parseCoords(hl); if (g.error) throw new Error(`Home coordinates: ${g.error}`); draft.fields.homell = fmtLL(g); }
    const changes = ALL_FIELDS.map(([k]) => k).filter(k => (draft.fields[k] || '').trim() !== (m.fields[k] || ''));
    const routesChanged = JSON.stringify(routes) !== JSON.stringify(m.routes || []);
    if (routesChanged) changes.push('routes');
    const poisChanged = JSON.stringify(pois) !== JSON.stringify(m.pois || []);
    if (poisChanged) changes.push('pois');
    const contacts = (draft.contacts || []).map(c => Object.fromEntries(XC_FIELDS.map(([k]) => [k, (c[k] || '').trim()]).filter(([, v]) => v))).filter(c => Object.keys(c).length);
    contacts.forEach((c, i) => { if (!c.name) throw new Error(`Contact ${i + 1} needs a name.`); });
    const contactsChanged = JSON.stringify(contacts) !== JSON.stringify(m.contacts || []);
    if (contactsChanged) changes.push('contacts');
    if (!changes.length) { toast('No changes to send.'); return; }
    const fields = {};
    changes.filter(k => k !== 'routes' && k !== 'pois' && k !== 'contacts').forEach(k => { m.fields[k] = draft.fields[k].trim(); fields[k] = m.fields[k]; });
    if (routesChanged) m.routes = routes;
    if (poisChanged) m.pois = pois;
    if (contactsChanged) m.contacts = contacts;
    mergeTypes(draft.newTypes);
    m.pois = m.pois || []; m.routes = m.routes || [];
    applyName(m);
    const usedCustom = [...new Set(m.pois.map(p => p.type).filter(t => !POI_LABEL[t]))];
    const typesOut = (st.poiTypes || []).filter(t => usedCustom.includes(t.id));
    m.rev += 1; m.updated = Date.now(); m.lastChanged = changes;
    draft = null; openEditRoutes = null;
    // Full card every time, so a phone that missed an earlier update still ends up exactly right.
    const text = await sealPacket({ kind: 'plan-update', full: true, from: m.id, rev: m.rev, ts: m.updated, changes, fields: Object.fromEntries(ALL_FIELDS.map(([k]) => [k, m.fields[k] || ''])), routes: m.routes || [], pois: m.pois || [], contacts: m.contacts || [], ...(typesOut.length ? { types: typesOut } : {}) });
    await saveSt();
    setOutput('mine', `Plan update ready (rev ${m.rev})`, text, null, ['Tap Copy.', 'Paste it into your group chat in Signal.', 'Each person copies it and taps Import.'], { shareKey: 'plan' });
    outbox = { text, label: `${m.name}'s rev ${m.rev}` };
    await render();
    $('#output')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Saving only changes this phone. Until the person confirms they posted the update in Signal, it stays on this list
  // (inside the encrypted data, so the reminder survives locking and reopening the app).
  const groupOwner = () => (st.group && (st.group.owner || st.group.by)) || null;
  const SHARE_NOUN = { plan: 'plan update', comms: 'comms update', intent: 'intent update', groupname: 'group name update' };
  function noteUnshared(key, label, text, noun) {
    st.unshared = (st.unshared || []).filter(u => !key || u.key !== key);   // a newer full update replaces an older one of the same kind
    const id = b64(rand(6));
    st.unshared.push({ id, key: key || id, label, noun: noun || SHARE_NOUN[key] || label.toLowerCase(), text, ts: Date.now() });
    return id;
  }
  // The Name in People & contacts is how a person appears everywhere. Only their own (signed) plan update can change it.
  function applyName(m) {
    const nm = ((m.fields || {}).callsign || '').trim();
    if (nm && nm !== m.name) { if (!m.addedAs) m.addedAs = m.name; m.name = nm; }
  }
  function setOutput(tabName, title, text, code, steps, extra = {}) {
    let shareId = null;
    if (!code) {
      shareId = noteUnshared(extra.shareKey || null, title.replace(/ ready/, ''), text, SHARE_NOUN[extra.shareKey] || title.replace(/ ready.*$/, '').toLowerCase());
      extra = { ...extra, shareNoun: st.unshared[st.unshared.length - 1].noun };
      steps = [...steps, 'Then tap "I posted it" so Rally Book stops reminding you.'];
      saveSt().catch(() => {});
    }
    lastOutput = { tab: tabName, title, text, code, steps, shareId, ...extra };
  }
  function unsharedBanner() {
    const list = (st.unshared || []).filter(u => !(lastOutput && lastOutput.shareId === u.id && lastOutput.tab === tab));
    if (!list.length) return '';
    return `
      <div class="panel unshared" role="status">
        <div>${list.map(u => `
          <div class="unshared-item">
            <h3>You haven't shared your ${esc(u.noun || u.label.toLowerCase())} yet</h3>
            <span class="small muted">${esc(u.label)} · made ${esc(fmt(u.ts))}</span>
            ${u.key === 'comms' || u.key === 'intent' ? `<p class="dibs-note"><span class="ast">*</span> Don't let this sit. If a teammate posts a ${u.key === 'comms' ? 'comms' : 'intent'} update to Signal first, theirs becomes the newest version. You'd need to import theirs, then redo your changes. <button class="linkbtn" type="button" data-act="showDibs" data-arg="${u.key}">See the first dibs rule</button></p>` : ''}
            <div class="row">
              <button class="btn btn-small btn-primary" type="button" data-act="copyUnshared" data-arg="${esc(u.id)}">Copy</button>
              <button class="btn btn-small" type="button" data-act="markShared" data-arg="${esc(u.id)}">I posted it</button>
            </div>
          </div>`).join('')}</div>
        <p class="small muted">${list.length === 1 ? 'It\'s' : 'They\'re'} saved on this phone only. Your team won't have ${list.length === 1 ? 'it' : 'them'} until you paste ${list.length === 1 ? 'it' : 'each one'} into Signal.</p>
      </div>`;
  }

  async function openImport() {
    let raw = $('#pasteIn').value.replace(/\s+/g, '');
    const at = raw.search(/RALLY[2R]\./); if (at > 0) raw = raw.slice(at);   // ignore a label like "FEEDBACK REQUEST…" in front
    pending = null;
    const fail = (t) => { importMsg = { ok: false, text: t }; return render(); };
    if (!raw) return fail('Paste an update first.');
    if (raw.startsWith('RALLYR.')) return fail('This is a restore package for setting up a phone. Open it from "Restore from a teammate" on the lock screen of the phone being set up.');
    const m = raw.match(/^RALLY2\.(\d+)\.([A-Za-z0-9+/=]+)$/);
    if (!m) return fail("This doesn't look like a Rally Book update. Make sure the whole message was copied.");
    const gen = Number(m[1]);
    if (st.removedSelf) return fail("This phone was removed from the group, so it can't open new updates.");
    const k = st.keys[gen];
    if (!k) return fail(gen > st.epoch
      ? "This update uses a newer group key this phone doesn't have. If someone was removed recently, import that key change first. If this phone was the one removed, this is expected."
      : 'This update uses a group key this phone has never had.');
    let env;
    try { env = JSON.parse(td.decode(await aesOpen(await groupKey(unb64(k)), unb64(m[2])))); }
    catch { return fail("This update couldn't be opened. Part of it may have been cut off when copying."); }
    const p = env.p, sig = env.s;
    const sender = person(p.from);

    if (p.kind === 'identity') {
      if (!(await verifyWith(p.signPub, p, sig))) return fail("This identity update failed its check. Don't trust it.");
      if (gen < st.epoch) return fail(`This was sent before the group key changed. Ask ${p.name} to send it again.`);
      if (sender && sender.status === 'removed') return fail(`${p.name} was removed from the group, so their new identity wasn't accepted.`);
      if (sender && sender.sign && sender.sign.x === p.signPub.x) return fail(`You already have ${p.name}'s current identity.`);
      pending = { type: 'identity', p, isNew: !sender || !sender.sign }; importMsg = null; return render();
    }
    if (!sender) return fail("This update is from someone who isn't in this phone's group list.");
    if (sender.status === 'removed') return fail(`${sender.name} was removed from the group. Their updates are no longer accepted.`);
    if (!sender.sign || !(await verifyWith(sender.sign, p, sig))) return fail(`This update claims to be from ${sender.name}, but it isn't signed by ${sender.name}'s phone. Don't trust it.`);

    if (p.kind === 'plan-update') {
      if (gen < st.epoch) return fail(`${sender.name} sent this before the group key changed. Ask them to send it again.`);
      if (p.rev <= sender.rev) return fail(`You already have ${sender.name}'s plan at rev ${sender.rev}. This update is rev ${p.rev}, so it was ignored.`);
      pending = { type: 'plan', p }; importMsg = null; return render();
    }
    if (p.kind === 'key-change') {
      if (p.epoch <= st.epoch) return fail('This phone already has this key change.');
      if (p.removed.includes(st.member)) { pending = { type: 'removedme', p, sender }; importMsg = null; return render(); }
      if (!p.wraps[st.member]) return fail("This key change doesn't include a key for this phone. Ask the sender to restore you.");
      pending = { type: 'key', p, sender }; importMsg = null; return render();
    }
    if (p.kind === 'feedback-status') {
      if (!p.item || !p.item.id) return fail("This doesn't look like a feedback status update.");
      const cur = (st.feedback || []).find(f => f.id === p.item.id);
      if (cur && (cur.doneTs || 0) >= p.ts) return fail('You already have this status (or a newer one) for that item.');
      pending = { type: 'fbstatus', p, sender }; importMsg = null; return render();
    }
    if (p.kind === 'feedback') {
      if ((st.feedback || []).some(f => f.id === p.id)) return fail('This feedback is already in your inbox.');
      pending = { type: 'feedback', p, sender }; importMsg = null; return render();
    }
    if (p.kind === 'intent-update') {
      if (gen < st.epoch) return fail(`${sender.name} sent this before the group key changed. Ask them to send it again.`);
      const cur = curIntent();
      const mineUnsharedI = (st.unshared || []).some(u => u.key === 'intent') && cur.by === st.member && p.from !== st.member;
      if (p.rev <= cur.rev && !(mineUnsharedI && p.rev >= cur.rev)) return fail(`You already have version ${cur.rev} of the intent. This update is version ${p.rev}, so it was ignored. If it has different changes, ask ${sender.name} to start from version ${cur.rev} and send it again.`);
      pending = { type: 'intent', p, sender }; importMsg = null; return render();
    }
    if (p.kind === 'group-name') {
      if (groupOwner() && p.from !== groupOwner()) return fail(`Only the person who started the group can rename it, so this update from ${sender.name} was ignored.`);
      if (gen < st.epoch) return fail(`${sender.name} sent this before the group key changed. Ask them to send it again.`);
      if (st.group && (st.group.ts || 0) >= p.ts) return fail('You already have this group name (or a newer one).');
      pending = { type: 'groupname', p, sender }; importMsg = null; return render();
    }
    if (p.kind === 'comms-update') {
      if (gen < st.epoch) return fail(`${sender.name} sent this before the group key changed. Ask them to send it again.`);
      const cur = curComms();
      const mineUnshared = (st.unshared || []).some(u => u.key === 'comms') && cur.by === st.member && p.from !== st.member;
      if (p.rev <= cur.rev && !(mineUnshared && p.rev >= cur.rev)) return fail(`You already have version ${cur.rev} of the comms plan. This one is version ${p.rev}, so it was ignored. First dibs: whoever posted first wins. ${sender.name} should import the latest, redo their changes, and send again.`);
      pending = { type: 'comms', p, sender }; importMsg = null; return render();
    }
    if (p.kind === 'types-update') {
      if (!Array.isArray(p.types)) return fail("This doesn't look like a point type update.");
      pending = { type: 'types', p, sender }; importMsg = null; return render();
    }
    if (p.app && p.app > APP_VERSION) return fail(`This update was made with a newer version of Rally Book (${p.app}). This phone has ${APP_VERSION}. Update the app, then import it again.`);
    return fail("This kind of update isn't supported by this version of the app.");
  }

  async function accept() {
    const p = pending.p;
    if (pending.type === 'plan') {
      const m = person(p.from);
      if (p.types) mergeTypes(p.types);
      const diff = planChanges(m, p);
      if (p.full) { m.fields = { ...emptyFields(), ...p.fields }; m.routes = p.routes || []; m.pois = p.pois || []; m.contacts = p.contacts || []; }
      else p.changes.forEach(k => { if (k === 'routes') m.routes = p.routes || []; else if (k === 'pois') m.pois = p.pois || []; else m.fields[k] = p.fields[k]; });
      applyName(m);
      m.rev = p.rev; m.updated = p.ts; m.lastChanged = diff;
      importMsg = { ok: true, text: `${m.name}'s plan updated to rev ${m.rev}. See it under Plans.` };
    } else if (pending.type === 'removedme') {
      st.removedSelf = true;
      importMsg = { ok: false, text: `This phone is now marked as removed. It keeps what it already had but can't open anything new.` };
    } else if (pending.type === 'fbstatus') {
      st.feedback = st.feedback || [];
      let f = st.feedback.find(x => x.id === p.item.id);
      if (!f) { f = { ...p.item }; delete f.text; st.feedback.unshift(f); }
      f.done = !!p.done; f.doneBy = p.from; f.doneTs = p.ts;
      f.summary = p.item.summary || f.summary || (p.item.text || '').slice(0, 120);
      if (p.done) { f.doneNote = p.note || ''; delete f.text; delete f.reopenNote; } else { f.reopenNote = p.note || ''; f.doneNote = ''; }
      importMsg = { ok: true, text: `Feedback ${p.done ? 'marked done' : 'reopened'}. See the Feedback inbox on the Group tab.` };
    } else if (pending.type === 'feedback') {
      st.feedback = st.feedback || [];
      st.feedback.unshift({ id: p.id, from: p.from, ts: p.ts, ftype: p.ftype, section: p.section, text: p.text, region: p.region, done: false });
      importMsg = { ok: true, text: 'Feedback saved to your inbox on the Group tab.' };
    } else if (pending.type === 'intent') {
      st.intent = { rev: p.rev, text: p.text, by: p.from, ts: p.ts };
      st.unshared = (st.unshared || []).filter(u => u.key !== 'intent');
      importMsg = { ok: true, text: `Intent updated to version ${p.rev}. See it under Intent at the top.` };
    } else if (pending.type === 'groupname') {
      st.group = { name: p.name, ts: p.ts, by: p.from, owner: groupOwner() || p.from };
      importMsg = { ok: true, text: `Group name changed to "${p.name}".` };
    } else if (pending.type === 'comms') {
      const cur = curComms(), nf = { ...emptyComms(), ...(p.fields || {}) };
      st.comms = { rev: p.rev, fields: nf, by: p.from, ts: p.ts, lastChanged: commsChanged(nf, cur.fields || {}) };
      st.unshared = (st.unshared || []).filter(u => u.key !== 'comms');
      if (lastOutput && lastOutput.tab === 'comms') lastOutput = null;
      const hadDraft = commsDirty();
      commsDraft = null; commsEditing = false;
      importMsg = { ok: true, text: `Comms plan updated to version ${p.rev}. See it on the Comms tab.${hadDraft ? ' Your unsaved comms edits were replaced.' : ''}` };
    } else if (pending.type === 'types') {
      mergeTypes(p.types);
      importMsg = { ok: true, text: `Point types updated.` };
    } else if (pending.type === 'identity') {
      let m = person(p.from);
      if (!m) { m = { id: p.from, name: p.name, status: 'active', rev: 0, updated: p.ts, lastChanged: [], fields: emptyFields(), routes: [], pois: [] }; st.roster.push(m); }
      m.sign = p.signPub; m.dh = p.dhPub;
      importMsg = { ok: true, text: pending.isNew ? `${p.name} added to the group.` : `${p.name}'s new phone is trusted. Their old phone's updates will be rejected.` };
    } else if (pending.type === 'key') {
      const dk = await dhKey(st.dhPriv, p.ephPub);
      const raw = await aesOpen(dk, unb64(p.wraps[st.member]));
      st.keys[p.epoch] = b64(raw); st.epoch = p.epoch;
      p.removed.forEach(id => { const r = person(id); if (r) r.status = 'removed'; });
      const names = p.removed.map(id => person(id)?.name || id).join(', ');
      importMsg = { ok: true, text: `New group key installed (generation ${p.epoch}). ${names} can no longer open new updates.` };
    }
    if (importMsg && importMsg.ok) importMsg.text += ' Now give the message a thumbs-up in Signal so the sender knows you have it.';
    pending = null;
    await saveSt();
    render();
  }

  async function removePerson(id) {
    const target = person(id);
    const newRaw = rand(32);
    const eph = await genPair('dh');
    const wraps = {}, skipped = [];
    for (const r of st.roster) {
      if (r.status !== 'active' || r.id === id || r.id === st.member) continue;
      if (!r.dh) { skipped.push(r.name); continue; }
      wraps[r.id] = b64(await aesSeal(await dhKey(eph.priv, r.dh), newRaw));
    }
    const payload = { kind: 'key-change', from: st.member, ts: Date.now(), epoch: st.epoch + 1, removed: [id], ephPub: eph.pub, wraps };
    const text = await sealPacket(payload); // sealed with the current key so everyone can open the envelope; only remaining members can unwrap the new key
    st.keys[payload.epoch] = b64(newRaw); st.epoch = payload.epoch; target.status = 'removed';
    await saveSt();
    confirmRemove = null;
    groupMsg = { ok: true, text: `${target.name} removed. This phone now uses group key generation ${st.epoch}.${skipped.length ? ` ${skipped.join(', ')} had no identity on file, so restore them afterward.` : ''}` };
    setOutput('group', 'Key change ready', text, null, [
      `Remove ${target.name} from the Signal group first.`,
      'Tap Copy, then paste it into the Signal group.',
      'Everyone else imports it to get the new key.']);
    outbox = { text, label: `${me().name}'s key change` };
    render();
  }

  async function makePackage(id, newName) {
    if (newName) {
      const base = newName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'member';
      id = base + '-' + b64(rand(3)).replace(/[^A-Za-z0-9]/g, '').slice(0, 4).toLowerCase();
      st.roster.push({ id, name: newName, status: 'active', sign: null, dh: null, rev: 0, updated: Date.now(), lastChanged: [], fields: { ...emptyFields(), callsign: newName }, routes: [], pois: [] });
      await saveSt();
    }
    const target = person(id);
    const code = makeCode();
    const cSalt = rand(16);
    const k = await pbkdf(normCode(code), cSalt);
    const data = { kind: 'restore', from: st.member, ts: Date.now(), member: id, epoch: st.epoch, key: st.keys[st.epoch], group: st.group || null, roster: st.roster };
    const text = 'RALLYR.' + b64(cat(cSalt, await aesSeal(k, te.encode(JSON.stringify(data)))));
    groupMsg = null;
    setOutput('group', `${newName ? 'Add' : 'Restore'} ${target.name}`, text, code, [
      `Send the package to ${target.name} in Signal.`,
      `Read the code to ${target.name} in person or on a call. Never put it in the same chat.`,
      `On their phone: Restore from a teammate, paste, enter the code, set a new password.`,
      `They then send their new identity and everyone imports it.`], { made: data.ts, ...(newName ? { newMember: id } : {}) });
    outboxRestore = { text, code, label: `${target.name}'s package` };
    render();
  }

  async function sendIdentity() {
    const m = me();
    const text = await sealPacket({ kind: 'identity', from: m.id, name: m.name, signPub: m.sign, dhPub: m.dh, ts: Date.now() });
    st.pendingIdentity = false; await saveSt();
    groupMsg = null;
    setOutput('group', 'Identity update ready', text, null, ['Tap Copy.', 'Paste it into the Signal group.', 'Each person imports it and taps Accept.']);
    outbox = { text, label: `${m.name}'s identity` };
    render();
  }

  async function changePass(form) {
    if (form.cpNew1.value !== form.cpNew2.value) { groupMsg = { ok: false, text: "The two new passwords don't match." }; return render(); }
    try { await aesOpen(await pbkdf(form.cpCur.value, salt), unb64(slotRead(slot).box)); }
    catch { groupMsg = { ok: false, text: "Current password is wrong." }; return render(); }
    salt = rand(16); pwKey = await pbkdf(form.cpNew1.value, salt);
    await saveSt();
    groupMsg = { ok: true, text: 'Password changed for this phone.' };
    render();
  }

    if (t.dataset.p !== undefined) {
      draft.pois[+t.dataset.p][t.dataset.k] = t.value;
      if (t.dataset.k === 'type') render().then(() => { if (t.value === '__new') $(`#ntn-${t.dataset.p}`)?.focus(); });
      return;
    }
    if (t.dataset.region !== undefined) {
      const r = draft.routes[+t.dataset.r]; r.regions = r.regions || [];
      const k = rkey(t.dataset.region);
      r.regions = r.regions.filter(g => rkey(g) !== k);
      if (t.checked) r.regions.push(t.dataset.region);
      return;
    }
    if (t.dataset.r !== undefined) {
      const r = draft.routes[+t.dataset.r];
      if (t.dataset.w !== undefined) r.points[+t.dataset.w][t.dataset.k] = t.value; else r[t.dataset.k] = t.value;
    } else if (t.name && t.name in draft.fields) draft.fields[t.name] = t.type === 'checkbox' ? (t.checked ? '1' : '') : t.value;
    syncMineButtons();
  });
  function syncMineButtons() {
    const f = document.querySelector('[data-form="mine"]'); if (!f) return;
    const has = !!f.querySelector('[data-act="mineDiscard"]');
    if (has === mineDirty()) return;
    const old = f.querySelector(':scope > .row:last-child, :scope > .btn-block:last-child');
    if (!old) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = mineDirty() ? `<div class="row"><button class="btn" type="button" data-act="mineDiscard">Discard changes</button><button class="btn btn-primary" type="button" data-act="submitForm">Save and create update</button></div>`
      : '<button class="btn btn-primary btn-block" type="button" data-act="submitForm">Save and create update</button>';
    old.replaceWith(tmp.firstElementChild);
  }

  const forms = {
    unlock: (f) => unlock($('#pass').value),
    restore: (f) => restore(f),
    start: (f) => startGroup(f),
    mine: () => savePlan(),
    addPerson: (f) => makePackage(null, f.newName.value.trim()),
    changePass: (f) => changePass(f),
  };
  // Forms are driven by plain button clicks (not native submit), because some
  // viewers and in-app previews silently block form submission.
  const formCheck = {
    restore: (f) => f.rPass1.value !== f.rPass2.value ? "The two passwords don't match." : '',
    start: (f) => f.sPass1.value !== f.sPass2.value ? "The two passwords don't match." : '',
    changePass: (f) => f.cpNew1.value !== f.cpNew2.value ? "The two new passwords don't match." : '',
  };
  const formConfirm = {
    restore: () => ({ title: 'Restore this phone?', body: `Anything already on ${SLOT_LABEL[slot]} is replaced with the group's data from this package.`, ok: 'Restore this phone', danger: !!slotRead(slot) }),
    addPerson: (f) => ({ title: `Create a package for ${f.newName.value.trim()}?`, body: "Anyone who has both the package and its code can read all of the group's plans. Only give them to this person, and read the code to them yourself.", ok: 'Create package' }),
    changePass: () => ({ title: 'Change your password?', body: "You'll need the new password to unlock this phone from now on. If you forget it, a teammate has to restore you.", ok: 'Change password' }),
  };
  function runForm(f, btn) {
    if (!f || !forms[f.dataset.form]) return;
    if (f.checkValidity && !f.checkValidity()) { try { f.reportValidity(); } catch {} return; }
    const problem = formCheck[f.dataset.form]?.(f);
    if (problem) { toast(problem); return; }
    const go = () => busy(btn || f.querySelector('[data-act="submitForm"]'), () => forms[f.dataset.form](f));
    const c = formConfirm[f.dataset.form];
    if (c) ask(c(f), go); else go();
  }
  actions.submitForm = (arg, btn) => runForm(btn.closest('[data-form]'), btn);
  document.addEventListener('submit', (e) => { e.preventDefault(); runForm(e.target.closest('[data-form]')); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
    if (!$('#sheet').hidden) return;
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    const f = e.target.closest('[data-form]');
    if (!f) return;
    e.preventDefault();
    runForm(f);
  });

  ['pointerdown', 'keydown', 'scroll'].forEach(ev => document.addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true, capture: true }));
  let idleWarned = false;
  setInterval(() => {
    if (!st) return;
    const idle = Date.now() - lastActivity;
    if (idle < IDLE_MS - 60000) { idleWarned = false; return; }
    if (idle >= IDLE_MS) { const had = hasUnsent(); idleWarned = false; lock(`Locked after ${IDLE_MIN} minutes without activity.${had ? ' Unsaved edits were cleared.' : ''}`); return; }
    if (!idleWarned && hasUnsent()) { idleWarned = true; toast('Locking in about a minute. Tap anywhere to stay, and save your edits.', 10000); }
  }, 5000);

  if (!window.crypto || !crypto.subtle) {
    $('#lockView').innerHTML = `<div class="lock-inner"><div class="brand">Rally <span>Book</span></div>
      <p class="notice notice-bad">This viewer can't run the app's encryption. Open the file in Safari or Chrome instead of a file preview.</p></div>`;
  } else {
    showLock();
  }
})();
</script>

</body>
